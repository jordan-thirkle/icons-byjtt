name: Bug report
description: Report a reproducible problem with JTT Icons.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never include secrets, access tokens, credentials, private data, or local paths.
  - type: input
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in one sentence.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give minimal reproducible steps or code.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, framework, package version, OS, etc.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
