name: Publish npm packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core="$(node -p "require('./packages/core/package.json').version")"
          react="$(node -p "require('./packages/react/package.json').version")"
          vue="$(node -p "require('./packages/vue/package.json').version")"
          svelte="$(node -p "require('./packages/svelte/package.json').version")"
          web="$(node -p "require('./packages/web/package.json').version")"
          test "$tag" = "$core" && test "$tag" = "$react" && test "$tag" = "$vue" && test "$tag" = "$svelte" && test "$tag" = "$web"
      - name: Verify repository
        run: |
          npm test
          npm run check
      - name: Publish @byjtt/icons
        run: npm publish ./packages/core --access public
      - name: Publish @byjtt/icons-react
        run: npm publish ./packages/react --access public
      - name: Publish @byjtt/icons-vue
        run: npm publish ./packages/vue --access public
      - name: Publish @byjtt/icons-svelte
        run: npm publish ./packages/svelte --access public
      - name: Publish @byjtt/icons-web
        run: npm publish ./packages/web --access public
