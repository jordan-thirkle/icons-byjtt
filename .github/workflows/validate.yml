name: Validate JTT Icons

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false
      - run: npm test
      - run: npm run check
      - run: node scripts/generate.mjs
      - run: git diff --exit-code
