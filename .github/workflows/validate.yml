name: Validate JTT Icons

on:
  push:
    branches: ["feat/ontology-search-scalability"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs
      - run: node scripts/generate-optical.mjs
      - run: npm test
      - run: npm run check
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain)"
