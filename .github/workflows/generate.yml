name: Generate JTT Icons
# Public product surfaces are generated from canonical metadata.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/generate.mjs
      - run: node scripts/generate-optical.mjs
      - run: npm test
      - run: npm run check
      - name: Upload optical review surfaces
        uses: actions/upload-artifact@v4
        with:
          name: jtt-optical-review-${{ github.sha }}
          path: |
            visual-snapshots/**/*.svg
            metadata/optical-audit.json
          if-no-files-found: error
      - name: Commit generated surfaces
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated surfaces are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html ai/index.html favicon.svg assets categories icons.json api/icons.json sitemap.xml llms.txt llms-full.txt metadata/optical-audit.json visual-snapshots packages/core packages/react packages/vue packages/svelte packages/web icons use-cases
          git commit -m "build: regenerate public and package surfaces [skip ci]"
          git push
