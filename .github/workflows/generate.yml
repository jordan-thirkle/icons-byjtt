name: Generate JTT Icons
# Public product surfaces are generated from canonical metadata.

on:
  push:
    branches: ["main", "product/public-library-v2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs
      - run: node scripts/generate-optical.mjs
      - run: npm test
      - run: npm run check
      - name: Commit generated surfaces
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated surfaces are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html favicon.svg categories icons.json api/icons.json sitemap.xml llms-full.txt metadata/optical-audit.json visual-snapshots packages/core packages/react icons
          git commit -m "build: regenerate public and package surfaces [skip ci]"
          git push
