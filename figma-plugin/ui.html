<!doctype html><html><head><meta charset="utf-8"><style>
:root{font:12px Inter,system-ui,sans-serif;color:#1f1f1f;background:#fff}body{margin:0;padding:16px}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d8d8d8;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#111}.meta{margin:12px 0;color:#666}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.icon{border:1px solid #e5e5e5;border-radius:10px;background:#fff;padding:10px;text-align:center;cursor:pointer}.icon:hover{border-color:#111}.icon svg{width:28px;height:28px}.name{margin-top:6px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body>
<input id="q" placeholder="Search by meaning, name, or AI concept…" autofocus><div class="meta" id="status">Loading JTT Icons…</div><div class="results" id="results"></div>
<script>
const q=document.querySelector("#q"),results=document.querySelector("#results"),status=document.querySelector("#status");let icons=[];
async function load(){try{const r=await fetch("https://icons.byjtt.com/api/icons.json");icons=(await r.json()).icons||[];status.textContent=icons.length+" canonical icons";render();}catch(e){status.textContent="JTT Icons is unavailable in this document.";}}
function render(){const query=q.value.trim().toLowerCase();const found=icons.filter(x=>!query||[x.name,x.title,...(x.tags||[]),...(x.aliases||[]),...(x.contexts||[])].join(" ").toLowerCase().includes(query)).slice(0,60);results.innerHTML=found.map(x=>'<button class="icon" data-name="'+x.name+'"><img src="https://icons.byjtt.com'+x.path+'" alt="" width="28" height="28"><div class="name">'+x.name+'</div></button>').join("");results.querySelectorAll("button").forEach(b=>b.onclick=()=>parent.postMessage({pluginMessage:{type:"insert",name:b.dataset.name}},"*"));status.textContent=(query?found.length+" matches":"Showing "+found.length+" icons")+" · click to insert";}
q.oninput=render;window.onmessage=e=>{const m=e.data.pluginMessage;if(m?.type==="inserted")status.textContent="Inserted "+m.name+" · search again";if(m?.type==="error")status.textContent=m.message};load();
</script></body></html>
