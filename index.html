<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JTT Icons — open-source SVG icons for humans and AI coding agents."><link rel="canonical" href="https://icons.byjtt.com/"><title>JTT Icons — Open Source SVG Icons</title><style>:root{color-scheme:dark;--bg:#08090b;--panel:#101216;--line:#252830;--text:#f5f6f8;--muted:#8d94a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{width:min(1240px,calc(100% - 32px));margin:auto}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;text-decoration:none}.nav{display:flex;gap:18px;color:var(--muted)}.nav a{color:inherit;text-decoration:none}.hero{padding:86px 0 52px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}h1{font-size:clamp(52px,8vw,96px);line-height:.9;letter-spacing:-.07em;max-width:900px;margin:18px 0 24px}.hero p{max-width:650px;font-size:18px;color:#d1d5dc}.search{position:sticky;top:0;z-index:2;padding:12px 0;background:rgba(8,9,11,.9);backdrop-filter:blur(14px)}input{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);outline:none;font-size:16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);border-radius:99px;background:none;color:var(--muted);padding:7px 11px;cursor:pointer}.chip.active,.chip:hover{color:var(--text);border-color:#555b66}.count{color:var(--muted);margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);margin-bottom:80px}.card{background:var(--bg);min-height:178px;padding:18px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between}.card:hover{background:#0d0f13}.icon{height:115px;display:grid;place-items:center}.icon img{width:54px;height:54px}.name{font-weight:600}.meta{font-size:12px;color:var(--muted);margin-top:2px}footer{border-top:1px solid var(--line);padding:28px 0 50px;color:var(--muted)}@media(max-width:600px){.hero{padding-top:58px}h1{font-size:58px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header><a class="brand" href="/">JTT / ICONS</a><nav class="nav"><a href="/llms.txt">AI docs</a><a href="https://github.com/jordan-thirkle/icons-byjtt">GitHub</a></nav></header><main><section class="hero"><div class="eyebrow">Open source · SVG · AI-ready</div><h1>Icons for the interfaces we're building next.</h1><p>A coherent icon system designed to be fast for humans and unambiguous for machines. Search concepts, inspect the catalogue and use canonical names in code.</p></section><div class="search"><input id="q" placeholder="Search icons, meanings, tags…" aria-label="Search icons"><div id="chips" class="chips"></div></div><div class="count" id="count"></div><section class="grid" id="grid"></section></main><footer>JTT Icons · MIT · Open source by BY JTT</footer></div><script>const I=[{"name":"arrow-up-right","title":"Arrow Up Right","category":"navigation","tags":["arrow","direction","external","diagonal"]},{"name":"check","title":"Check","category":"actions","tags":["check","confirm","done","success","tick"]},{"name":"x","title":"X","category":"actions","tags":["close","dismiss","remove","cancel"]},{"name":"plus","title":"Plus","category":"actions","tags":["add","create","new"]},{"name":"minus","title":"Minus","category":"actions","tags":["subtract","remove","less"]},{"name":"search","title":"Search","category":"interface","tags":["search","find","lookup","magnify"]},{"name":"menu","title":"Menu","category":"navigation","tags":["menu","navigation","hamburger"]},{"name":"heart","title":"Heart","category":"communication","tags":["heart","like","favourite","favorite"]},{"name":"star","title":"Star","category":"interface","tags":["star","favorite","rating"]},{"name":"settings","title":"Settings","category":"interface","tags":["settings","gear","configuration"]},{"name":"github","title":"GitHub","category":"brands","tags":["github","git","developer","code"]},{"name":"code","title":"Code","category":"developer","tags":["code","developer","programming"]}];let cat="all";const q=document.querySelector("#q"),chips=document.querySelector("#chips"),grid=document.querySelector("#grid");for(const c of["all",...new Set(I.map(x=>x.category))]){const b=document.createElement("button");b.className="chip"+(c==="all"?" active":"");b.textContent=c;b.onclick=()=>{cat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent===c));render()};chips.appendChild(b)}function render(){const s=q.value.toLowerCase().trim();const list=I.filter(x=>(cat==="all"||x.category===cat)&&(!s||[x.name,x.title,x.category,...x.tags].join(" ").includes(s)));document.querySelector("#count").textContent=list.length+" icons";grid.innerHTML=list.map(x=>'<a class="card" href="/icons/'+x.name+'"><div class="icon"><img src="/icons/'+x.name+'.svg" alt="" width="54" height="54"></div><div><div class="name">'+x.title+'</div><div class="meta">'+x.category+' · '+x.name+'</div></div></a>').join("")}q.oninput=render;render();</script></body></html>
